name: E2E UI suite

# WHY THIS IS A SEPARATE, MANUAL WORKFLOW
# `ci.yml` is the deployment gate: `cd.yml` waits on its conclusion. This suite drives the real
# dev server in a real browser (tests/*.e2e.ts, built on the `e2e` runner). It has not yet been
# measured on a runner: the dev server's cold start also launches the ML sidecar and checks the
# 700 MB RaSP index, which a clean checkout does not carry, so a first run may need data or a
# stub before it is green. Until a run proves it, it must not be able to block a deploy.
#
# IT RUNS ON EVERY PULL REQUEST THAT TOUCHES THE UI, STILL NON-GATING. A suite that only runs when
# someone remembers to dispatch it goes red unseen: the search form was folded behind a disclosure
# and four design-spacing tests broke with no run to say so. `pull_request` gives it a result on
# every UI change, and because `cd.yml` waits on `ci.yml` alone, a red e2e run cannot block a
# deploy. It is not a required check until it has been green on a runner over a run of PRs.
#
# To promote it: once it has a clean record, fold the job into `ci.yml` (and add the script to
# `npm run verify` or allow-list it in `scripts/check-verify-parity.ts`).
#
# WHAT IT RUNS. Only the offline-safe tags. The `live` analysis test depends on Ensembl, ClinVar,
# UniProt and others answering, so it is opt-in through the `tags` input.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**/*.e2e.ts'
      - 'tests/support.ts'
      - 'e2e.config.ts'
      - 'server.ts'
      - 'server/**'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated e2e tags to run (add `live` to include the network analysis test)"
        default: "smoke,navigation,search,shell"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # e2e needs Node ^22.22.3 or >=24.8.0; '22' resolves to the newest 22.x.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Node dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Install the browser
        run: npx @e2e-dev/web install chromium --with-deps

      # `npm run test:e2e` would be a CI script that `scripts/check-verify-parity.ts` expects in
      # `verify`; calling the runner directly keeps this experiment out of that contract.
      - name: Run the UI suite
        # `inputs.tags` is empty on a pull_request run, so the default list is repeated here.
        run: npx e2e run --tag "${{ inputs.tags || 'smoke,navigation,search,shell' }}" --reporter list,junit
        env:
          # The runner starts the server itself (e2e.config.ts). A checkout has no .env, and the server
          # refuses to start without APP_API_TOKEN and APP_SESSION_SECRET, so give it throwaways for
          # this job only.
          # AUTH_MODE=legacy needs no sign-in.
          NODE_ENV: development
          AUTH_MODE: legacy
          APP_API_TOKEN: e2e-ci-throwaway-token
          APP_SESSION_SECRET: e2e-ci-throwaway-session-secret-0123456789

      - name: Upload e2e evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-evidence
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/summary.md
            .e2e/results/
            .e2e/logs/
          retention-days: 7
          if-no-files-found: ignore
