name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('tools/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync Python tools environment
        run: uv sync --project tools --no-dev

      - name: Cache Vitest results
        uses: actions/cache@v5
        with:
          path: node_modules/.vitest
          key: ${{ runner.os }}-vitest-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-

      - name: Install Node dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=critical

      - name: Run linter
        run: npm run lint

      - name: Run tests and collect coverage
        run: npm run test:coverage

      - name: Run production build verification
        run: npm run build

      - name: Upload PR build preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: pr-build-preview
          path: dist/
          retention-days: 7

      - name: Generate CI Summary Report
        if: always()
        run: |
          echo "### 🚀 CI Quality & Build Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch / Ref**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gates**: Architectural boundaries, TypeScript typecheck, and coverage thresholds passed." >> $GITHUB_STEP_SUMMARY
