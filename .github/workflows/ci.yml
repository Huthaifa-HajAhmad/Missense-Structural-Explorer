name: Continuous Integration

# NO `paths-ignore` HERE, deliberately. It reads like free savings: a docs-only push would skip the
# whole pipeline, deploy included, since a path-filtered commit produces no run for `cd.yml`'s
# `workflow_run` to hang off. Measured on 2026-09-29 before adding it — of 42 sampled pushes to main,
# ZERO were docs-only, so it would have saved nothing on this repo's actual push pattern. It is not
# free in correctness terms either: `deploy/Dockerfile.oci` ends with `COPY README.md ./`, so README
# content ships inside the image, and a blanket `**.md` ignore would mean an edited README never
# reaches production. Re-measure before reaching for this again.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Manual run, for trying a runner image before adopting it (see the RUNNER note below). A dispatched
  # run is not a `push`, so `cd.yml` - which gates on `event == 'push'` - never deploys it.
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image to run on'
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-26.04

# A superseded push cancels its own run. Deployment waits on this workflow, so time spent finishing a
# stale run is latency added to the deploy of the newer commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ONE job. History of the shape, all measured:
#   serial   : npm ci 79s -> lint 6s -> tests+coverage 199s -> build 22s  = 371s (6m11s)
#   3 jobs   : optimised for wall-clock; each paid its own checkout + setup-node + `npm ci`
#   2 jobs   : `quality` + `geometry` (31s of harness behind 88s of setup, billed as a whole 2 min)
#   1 job    : this file. GitHub bills every job separately and rounds each up to the whole minute, and
#              the account is the binding constraint (90% of 2,000 included minutes on 2026-09-29), so
#              a job that exists to run 31s of work is a job that costs 2 minutes.
#
# The geometry harnesses used to be separate for two reasons, both dissolved here. "It needs a Chromium
# toolchain" — `ubuntu-latest` ships Chrome, so there is nothing extra to install. "Its failure artifact
# is only meaningful next to its own steps" — the upload step is now conditioned on that step's own
# outcome (`steps.geometry.outcome`), so a lint failure still never uploads renders for a run that did
# not happen.
#
# INDEPENDENT GATES ALL REPORT. A failing step normally skips the rest of its job, which in one job would
# mean a test failure hides a geometry failure (two parallel jobs used to show both). Every gate after
# `lint` therefore runs on `!cancelled() && steps.lint.outcome == 'success'`: install/audit/lint still
# fail fast, but past that point one red run lists every red gate instead of one per push. The cheap
# gates run first so the first red appears early; the long test step is last.
#
# THE TEST STEP IS THE RUN. Run 37794034476 (PR #80): 9m04s for `quality`, of which `test:coverage`
# was 419s. This is a PRIVATE repository, so `ubuntu-latest` is the standard 2-vCPU runner, and
# Vitest's default of `cores - 1` is ONE worker: the 4,273 tests ran serially (tests 178s + import 71s
# + environment 56s + setup 44s + transform 16s = 365s of per-file work). `vite.config.ts` now uses
# every core on CI. Sharding was considered and rejected: each shard repays ~90s of setup, so it buys
# wall-clock by spending exactly the billed minutes this file is trying to save. Two workers do it for
# free. Real-time retry/poll sleeps and live-Ensembl calls inside tests were also removed (see
# `setBackoffScaleForTests` in http-client.ts and `setPollDelayScaleForTests` in foldxService.ts).
#
# THE RUNNER IS PINNED. `ubuntu-latest` begins migrating to Ubuntu 26.04 on 2026-10-19 and completes
# 2026-11-19 (actions/runner-images#14748) — a rollout over weeks, so for that window `latest` would
# mean either image depending on the run. A pinned image makes a red run mean the change. To adopt
# 26.04 deliberately, run this workflow by hand (Actions -> Continuous Integration -> Run workflow)
# with `runner` = `ubuntu-26.04`: it exercises Chrome discovery for the geometry harnesses and Node 22
# there without touching any PR. Move the default below once that is green.
#
# RUN THE SAME SCRIPTS LOCALLY. `npm run verify` is this workflow's gate set in one command:
# lint + test:coverage + verify:geometry + build. The point is not to run the gates twice — it is that
# there is ONE definition of which gates exist. CI is not a slower re-run of an unknown set; it is the
# same set, executed on a clean clone, on another OS, against the commit rather than the working tree.
#
# `scripts/check-verify-parity.ts` enforces that, as part of `npm run lint`: it fails if a workflow
# gates on a script `verify` does not reach. It exists because the drift is silent and one-directional —
# someone adds a gate here, CI starts catching a defect class, and `verify` keeps saying OK. See
# doc/INSPECTOR_UI_UX_AUDIT.md §0.5 for what it cost: a neutral-ramp change pushed the disulfide swatch
# to 2.85:1, no local command covered the harness that measures it, and a green local run of 2176 tests
# said nothing about the step that failed.
#
# The Python/uv setup is GONE (36s: Set up Python, Install uv, Cache uv, uv sync). Every gate here —
# check-boundaries, tsc, vitest, vite/esbuild — is Node-only, and `tools/` is a runtime dependency of
# the deployed VM. The deployment state-machine tests now use the runner's bundled Python standard
# library, without uv, model dependencies, or a separate Python setup step.
#
# Coverage stays on: it carries the coverage thresholds in `vite.config.ts`, so it is a gate, not a
# report. The old note here ("49s with coverage vs 48s without") was measured against a 2,176-test suite;
# re-measured on 2026-10-08 at 4,267 tests with two workers: 158s without, 176s with (+11%). Dropping it
# from PR runs would save ~18s locally and forfeit the threshold gate, so it stays.
jobs:
  quality:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # NO npm cache. `package.json` declares `packageManager`, and `setup-node@v5` turns on npm caching
      # for any project that does — silently, with no `cache:` input — so this step was restoring and
      # re-saving a ~669 MB `~/.npm` entry (run 37794034476: "Cache Size: ~669 MB"). That entry is what
      # blew the 500 MB Actions storage allowance on GitHub Free (measured 2026-09-29: 176 MB of STORAGE
      # overage, not minutes), and it bought nothing: `npm ci` took 77s WITH the warm cache, because
      # extracting and linking dominates, not downloading. `package-manager-cache: false` is the switch
      # that actually turns it off. `npm ci --prefer-offline` still reads the cache the runner image ships.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      # The "Cache Vitest results" step that used to sit here is gone, for two measured reasons.
      # The path was `node_modules/.vitest`, which is not Vitest's cache directory — that is
      # `node_modules/.vite` (present locally) and Vitest's `cacheDir` defaults to `node_modules/.vite`.
      # `.vitest` does not exist, which is why the repo has never held a single vitest cache entry;
      # the step cached nothing. Its key also interpolated `github.sha`, so it could never be hit
      # exactly and every run would have written a fresh entry had the path existed.
      - name: Install Node dependencies
        # `--prefer-offline` uses the npm cache the runner image ships; `--no-audit`/`--fund` skip work
        # that the explicit audit step already does.
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run security audit
        # NOT part of `npm run verify`: it resolves against a live advisory database, so its verdict
        # depends on when it runs rather than on the tree, and a developer cannot fix a newly-published
        # advisory by editing code. Allow-listed in `scripts/check-verify-parity.ts` with that reason.
        #
        # `--omit=dev` (set in the script, not here) scopes the gate to the dependencies that ship:
        # `deploy/Dockerfile.oci` installs the runtime tree with `npm ci --omit=dev`, so production-only
        # is the set that reaches users, and a critical there is always actionable here. A dev-only
        # critical may be unfixable by any edit to this repository. Measured on 2026-10-06: new
        # advisories landed between 21:30 and 08:25 and turned this step red on three unrelated PRs at
        # once, `main` included. Four of the five criticals were `simple-git` and `@simple-git/argv-parser`,
        # reachable only through `@zvec/zvec-grep`'s optional `node-llama-cpp` — dev-only search tooling —
        # and no fix exists upstream: `node-llama-cpp@latest` still declares `simple-git: ^3.36.0` while
        # the advisory covers everything `<= 4.0.1`, so that caret can never satisfy it. npm's own
        # suggested remedy was to *downgrade* `@zvec/zvec-grep`, which would break `npm run search`
        # rather than patch anything. The fifth, `proxy-addr`, was a genuine production critical and is
        # fixed here by taking the lockfile from 2.0.7 to 2.0.8. A gate nobody can turn green is a gate
        # that gets baselined or bypassed; dev advisories are still reported by `npm audit`, just not fatal.
        run: npm run audit

      - name: Run linter
        id: lint
        # boundaries + focus indicators + verify-parity + tsc --noEmit
        run: npm run lint

      # Measured layout. The harnesses bundle the real component with the real stylesheet, render it in
      # headless Chromium and assert geometry jsdom cannot see: getBBox, computed styles, :focus-visible,
      # and the rendered effect of a filter. They exist because two layout regressions in the variant
      # header and four in the Functional Domains track were previously verified only by eye.
      #
      # One step, one script (`verify:geometry`), which is also what `npm run verify` calls. A
      # Chromium-based browser is required. The harnesses search the usual locations per platform and
      # take `GEOMETRY_BROWSER` / `CHROME_PATH` as an override, failing with that instruction rather
      # than a stack trace. The Ubuntu runner images ship Chrome at /usr/bin/google-chrome. Deployment
      # gates on this workflow's overall conclusion, so a geometry failure stops a deploy.
      - name: Variant header, Functional Domains and Landscape geometry
        id: geometry
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        env:
          # Makes the harness save the render it measured, for the artifact step below.
          TRACK_SHOT: "1"
          LAND_SHOT: "1"
        run: npm run verify:geometry

      # A geometry failure is only actionable next to the render that produced it, and each
      # harness's dist/ is a self-contained page. Keyed to the geometry step's OWN outcome: in a single
      # job `failure()` alone is true for any earlier failure, which would upload renders that were
      # never produced.
      - name: Upload geometry renders
        if: ${{ !cancelled() && steps.geometry.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: geometry-renders
          path: |
            tools/header-geometry/dist/
            tools/function-track-geometry/dist/
            tools/landscape-geometry/dist/
            tools/landscape-geometry/landscape-geometry.png
            tools/function-track-geometry/function-track.png
          retention-days: 7

      - name: Test deployment failure paths
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        run: npm run test:deployment

      - name: Test evidence context imports
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        run: npm run test:evidence-context-import

      - name: Run production build verification
        id: build
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        run: npm run build

      - name: Upload PR build preview artifact
        if: ${{ github.event_name == 'pull_request' && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: pr-build-preview
          path: dist/
          retention-days: 7

      # Last because it is the long one. Everything above has already reported.
      - name: Run tests and collect coverage
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        run: npm run test:coverage

      - name: Generate CI Summary Report
        if: always()
        run: |
          echo "### 🚀 CI Quality & Build Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch / Ref**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner image**: \`${{ inputs.runner || 'ubuntu-24.04' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Gates**: architectural boundaries, TypeScript typecheck, geometry, deployment and evidence-context tests, production build, and tests with coverage thresholds." >> $GITHUB_STEP_SUMMARY
