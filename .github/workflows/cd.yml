name: Continuous Deployment (OCI)

on:
  # GATED ON CI. This workflow used to run on every push to main, so it deployed commits whose
  # lint/test/build gates had FAILED — observed: commit 4a6a949 was deployed (run 35455821454)
  # while its CI run 35455821450 died in the Python setup step before any gate ran.
  #
  # `types: [completed]` also fires for skipped and cancelled runs; the `if` below is what keeps
  # this to successful PUSH runs of the default branch (a fork PR whose head branch happens to be
  # named `main` also satisfies `branches`, and must not deploy).
  #
  # WHAT "THE CI RUN" NOW CONTAINS. `ci.yml` runs the full gate set on a pull request, and on the push
  # that lands that PR it runs a REDUCED set — install, audit, lint, the deployment-path and
  # evidence-context tests, and the production build — skipping the two steps that are pure functions of
  # the tree (`geometry` and `test:coverage`), because the PR run already measured that exact tree. The
  # proof is tree equality, and `ci.yml` only takes the reduced path when it holds; every other case,
  # including a direct push to main, still runs everything. So this trigger is unchanged in meaning:
  # a green run on a push to main is still the precondition for a deploy, and the commit it deploys is
  # still the commit that run validated. What changed is that the test evidence for that commit is the
  # PR run's, established by tree equality rather than by re-running the suite here. The run's step
  # summary records which gate set it was and why.
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      statuses: write
    # Pinned to match ci.yml: `ubuntu-latest` migrates to 26.04 over 2026-10-19..11-19, and a production
    # deploy should not be the first thing to meet a new image. Move both together (see ci.yml).
    runs-on: ubuntu-24.04
    # Hard ceiling on the whole job. The cost that actually hurt sat OUTSIDE the confirmation
    # window: in run 36710716430 the SSH step spent 40 min 31 s between drone-ssh printing its
    # version banner (11:47:45) and the first line of the remote script (12:28:16) — the VM was too
    # busy to finish an SSH session — and the step still reported success 43 min later. The action's
    # `timeout` input only bounds the initial dial, not the handshake after it, so nothing here
    # stopped it. A red run at this limit still means "the deploy was never dispatched".
    #
    # Raised 2026-10-12 from 6 min, because the job now also polls the public revision endpoint
    # (see the last step): dispatch + its window is ~2 min (push) or ~4 min (manual), plus
    # DEPLOY_VERDICT_SECONDS of 300 / 600 — ~14 min worst case. 20 min is that sum plus slack for
    # a slow SSH handshake. The old 6-min ceiling could not have held a verdict wait at all — it
    # would have killed the run mid-poll and reported a red for a deploy that was landing fine.
    timeout-minutes: 20
    if: >-
      github.repository == 'Huthaifa-HajAhmad/Missense-Structural-Explorer' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    env:
      OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      # The revision CI just validated. Deploying exactly this commit is what makes the gate mean
      # something: a push that lands while CI is still running is not deployed by this run.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # How long the runner waits for the VM to report a verdict before it stops watching.
      #
      # Shortened 2026-09-30 from a flat "180". Measured on the five most recent CD runs: the SSH
      # step took 186/187/197/207/237 s and NOT ONE of them reported DEPLOY_OK inside the window.
      # Every run sat out the full 180 s and left through the "no verdict" branch below, so the
      # window was buying zero verification while costing ~180 s of billed runner time per deploy
      # (~600 of the 1,800-minute month at 202 deploys — a third of the budget spent asleep).
      #
      # A warm-cache deploy really does finish in ~110 s, but the runner no longer watches the build,
      # so waiting here is not what makes a deploy safe: the health-gated standby handover is.
      # The window still catches
      # an error that happens on the VM immediately — invalid compose file, no docker daemon, the
      # superseded-revision guard tripping — and all of those surface in seconds, never minutes.
      # So a push deploy waits 30 s, while a manual workflow_dispatch keeps the long window: there a
      # human pressed the button and asked for the verdict. Tune here, not in the step.
      DEPLOY_CONFIRM_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '180' || '30' }}
      # How long the runner waits for production to actually serve DEPLOY_SHA, measured by
      # polling the same public /api/v1/version that rollout.py itself trusts and that the
      # drift watch reads — not by holding an SSH session open. A push deploy waits 300 s: a
      # warm-cache deploy is ~110 s after dispatch, so that is ~2.5x margin, and a cold build
      # (~20 min) outlives ANY affordable window, so a longer push wait would only bill idle
      # minutes before the same warning — the cost the 30 s confirm window above was cut to avoid.
      # A manual workflow_dispatch keeps 600 s: a human asked for the verdict. The wait exits the
      # moment the commit is live, so the bill is time-to-verdict rather than the ceiling.
      # Longer than that belongs to the detached rollout and the drift watch, and failing here for
      # one would mean red runs for healthy deploys.
      DEPLOY_VERDICT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '600' || '300' }}
      # The public revision endpoint: the one true "is it deployed" signal, reachable from
      # runners, machines, and the VM alike (rollout.py reads exactly this in public_version()).
      LIVE_URL: https://missense-resolve.duckdns.org/api/v1/version
    steps:
      - name: Require deploy credentials
        # A skipped deploy is indistinguishable from a successful one in the runs list, which is
        # how an unconfigured secret comes to look like a healthy pipeline. Fail loudly instead.
        run: |
          if [ -z "$OCI_SSH_HOST" ] || [ -z "$OCI_SSH_KEY" ]; then
            echo "::error::OCI_SSH_HOST / OCI_SSH_KEY are not configured; refusing to report success without deploying."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # THE RUNNER NEVER WAITS FOR A BUSY LOCK, AND NEVER WATCHES THE BUILD.
      #
      # This step used to hold the runner for the entire `docker compose up -d --build`, which runs
      # on the OCI VM. Run 36035616379 held it for 13m04s of a 13m17s job; the runner was idle for
      # all of it, and the account was billed for it. Across 202 CD runs in the Sep 2026 cycle that
      # was the single largest avoidable line in a 1,800-minute month.
      #
      # 2026-10-09: the remaining blocker moved to the VM as well, after run 37904035903 failed.
      # The build was already dispatched detached, but the foreground SSH script still took the
      # HOST LOCK (`flock -w 180`) before dispatching it — and a rollout (build + handover + drain)
      # legitimately holds that lock for ~20 min cold, measured on mse-deploy-a2ef063dba12.log.
      # Run 37904035903 hit exactly that: the PR #86 rollout still held the lock, the 180 s wait
      # expired, the run went RED with DEPLOY_DEFERRED. The SHA (59c514d) was still the tip of
      # main, so nothing superseded it and nothing ever re-dispatched it: a healthy, CI-validated
      # commit sat undeployed in production until a human re-ran the workflow. The runner is the
      # wrong place to wait for the lock — the wait costs billed minutes the runner cannot afford
      # (6 min job ceiling), and failing means the commit is orphaned, not deferred.
      #
      # So the runner now does only what is fast and definitive: the supersede pre-check, write a
      # detached WORKER on the VM, dispatch it under setsid, watch one short confirmation window
      # so immediate failures still fail the run, and return. The worker owns the host lock wait:
      # it queues for up to 2 h (rollout.py's own ceilings sum to ~100 min: 3600 build + 600
      # readiness + 1800 drain), re-checking between slices whether a newer revision reached main.
      # When the VM is idle the behavior is byte-for-byte what it was: the worker takes the lock
      # instantly, checkout/asset-restore/build/handover run as before, and DEPLOY_OK or
      # DEPLOY_FAILED surfaces inside the window. When the lock is busy, the deploy QUEUES behind
      # the active rollout and resolves itself — production keeps serving the previous generation
      # either way, and the journal (deploy/runtime/rollout.json) stays the authoritative record.
      #
      # What is still deliberately NOT claimed: when the window lapses, this run asserts neither
      # success nor failure — it asserts "dispatched and self-resolving". Production safety does
      # not depend on the runner asserting it.
      # A GREEN RUN HERE MEANS "DISPATCHED", NOT "LIVE" — so the commit carries its own truthful status.
      # `production/deploy` is pending from the moment this run starts and turns success only when the
      # public /api/v1/version reports DEPLOY_SHA (this run's verdict poll, or the drift watch later).
      # It turns failure when the dispatch fails or the drift watch's grace passes. No runner time is
      # spent waiting: the status, not the run, says whether a merge is live.
      - name: Mark production deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" -f state=pending \
            -f context=production/deploy -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Rolling out; NOT live yet" >/dev/null

      - name: Deploy to OCI VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          # No longer a deploy timeout — only has to outlast the confirmation window plus dispatch.
          command_timeout: 10m
          envs: DEPLOY_SHA,DEPLOY_CONFIRM_SECONDS
          script: |
            set -eu
            cd Missense-Structural-Explorer || exit 1
            echo "[CD] Deploying the CI-validated commit $DEPLOY_SHA"

            git fetch --all --prune

            # COMMIT ORDERING PRE-CHECK: CI runs can finish out of order, so an older commit's
            # successful run could otherwise overwrite a newer deployment. If a newer revision
            # already reached the tip of main, skip immediately — without waiting or taking
            # anything. The worker re-checks this again once it holds the lock.
            TIP="$(git rev-parse origin/main)"
            if [ "$TIP" != "$DEPLOY_SHA" ]; then
              echo "[CD] $DEPLOY_SHA is superseded by $TIP; skipping — the newer revision deploys itself."
              exit 0
            fi

            # EVERYTHING EXPENSIVE RUNS DETACHED, INCLUDING THE LOCK WAIT. Unique per-dispatch
            # names (STAMP) are not cosmetic: bash reads scripts incrementally, so a fixed path
            # rewritten while a queued worker from a previous run is still executing it would
            # corrupt the running instance mid-flight.
            STAMP="$(date +%Y%m%d-%H%M%S)-$$"
            LOG="$HOME/mse-deploy-$(echo "$DEPLOY_SHA" | cut -c1-12)-$STAMP.log"
            WORKER="$HOME/.mse-deploy-worker-$STAMP.sh"
            : > "$LOG"

            # Quoted heredoc: nothing below is interpolated by this shell, so `$?` and friends
            # belong to the worker rather than being expanded here. The SHA is passed as an
            # argument — it is NOT baked into the script text.
            cat > "$WORKER" <<'MSE_WORKER_EOF'
            #!/usr/bin/env bash
            # Detached deploy worker for the OCI VM. The Runner writes and dispatches this file
            # under setsid and then returns; every wait a slow VM can impose — the host lock
            # above all — is paid here, outside any billed runner. One invocation is exactly one
            # deploy attempt for $1 (a full 40-hex SHA).
            set -eu
            DEPLOY_SHA="$1"
            on_fail() { rc=$?; echo "[CD] DEPLOY_FAILED rc=$rc"; exit "$rc"; }
            trap on_fail ERR

            # Self-delete now: bash reads the script through one open descriptor, so removing
            # the path is safe mid-execution and zero-future-costs — no stale worker file can
            # accumulate for a queued (still-running) invocation to have its file rewritten
            # under it, and $HOME stays clean without any cleanup job.
            rm -f -- "$0" 2>/dev/null || true

            # Self-contained: the dispatcher cd'd here, but the worker must not depend on an
            # inherited working directory (manual re-runs, cron audits, post-mortems).
            cd "$HOME/Missense-Structural-Explorer"

            echo "[CD] worker start commit=$DEPLOY_SHA"

            # THE HOST LOCK IS WAITED FOR HERE, NOT IN THE RUNNER. The workflow concurrency group
            # ends when the SSH session does, but a rollout (build + handover + drain) outlives it
            # by design; the old foreground `flock -w 180` could not cover that span and
            # 37904035903 died of exactly that race. Here the wait is patient, unbilled, and
            # abortable the moment continuing would be pointless.
            exec 9>"$HOME/.mse-deploy.lock"
            LOCK_DEADLINE=$(( $(date +%s) + 7200 ))
            acquired=0
            while [ "$(date +%s)" -lt "$LOCK_DEADLINE" ]; do
              if flock -w 60 9; then
                acquired=1
                break
              fi
              # Each ungranted minute, check whether the queue slot is still wanted: once a
              # newer revision reaches main, this queued deploy is redundant by definition.
              git fetch --all --prune >/dev/null 2>&1 || true
              TIP="$(git rev-parse origin/main)"
              if [ "$TIP" != "$DEPLOY_SHA" ]; then
                echo "[CD] DEPLOY_SUPERSEDED: $DEPLOY_SHA superseded by $TIP while queued for the host lock."
                exit 0
              fi
            done
            if [ "$acquired" -ne 1 ]; then
              # The runner already reported green ("queued"); the wedge surfaces here and in the
              # journal the runbook points at. 2 h of a continuously held lock means a rollout
              # process is hung and needs human attention.
              echo "[CD] DEPLOY_DEFERRED: the host lock never freed within 2h; production unchanged."
              exit 1
            fi
            export MSE_DEPLOY_LOCK_FD=9

            # Re-verify tip while holding the lock in case a newer commit landed while waiting; a
            # concurrent queued deployment deploys that revision itself, so this one must not run.
            git fetch --all --prune
            TIP="$(git rev-parse origin/main)"
            if [ "$TIP" != "$DEPLOY_SHA" ]; then
              echo "[CD] $DEPLOY_SHA is superseded by $TIP; skipping — the newer revision deploys itself."
              exit 0
            fi

            # UNTRACKED-ASSET PRESERVE. FoldX (licensed), the model weights, and the deployment
            # runbook are deliberately untracked as of 2026-09-29, so that nothing licensed,
            # third-party, or infrastructure-revealing is redistributed if this repo is ever made
            # public. That creates a deploy hazard which was verified on a throwaway repo, not
            # assumed: checking out a revision that does not track a path that the CURRENT revision
            # does track DELETES it. Simulated `A (tracks the binary) -> git checkout --force B (does
            # not)` and the file was gone; when the whole directory stops being tracked, the
            # directory itself is removed, so the compose bind mount at ../tools/foldx_linux would
            # have pointed at nothing and FoldX would have vanished from the running app on the
            # first deploy after the untracking commit.
            #
            # This survives because a filesystem copy is taken before the switch and put back after
            # it. It is unconditional and idempotent: on a revision where these paths are still
            # tracked the copy is simply restored over itself.
            ASSET_PATHS="tools/foldx tools/foldx_linux tools/thermompnn/models tools/thermompnn/vanilla_model_weights tools/model_server_app/checkpoints doc/DEPLOYMENT_OCI.md"
            ASSET_SAFE="$HOME/.mse-untracked-assets"
            rm -rf "$ASSET_SAFE"
            mkdir -p "$ASSET_SAFE"
            for p in $ASSET_PATHS; do
              if [ -e "$p" ]; then
                mkdir -p "$ASSET_SAFE/$(dirname "$p")"
                # -T: copy AS the destination, never INTO it.
                cp -aT "$p" "$ASSET_SAFE/$p"
                echo "[CD] preserved $p"
              fi
            done

            git checkout --force "$DEPLOY_SHA"

            for p in $ASSET_PATHS; do
              if [ -e "$ASSET_SAFE/$p" ]; then
                # Copy AS the destination without deleting bind-mounted files from the serving app.
                # -T avoids repeated directory nesting on every subsequent deployment.
                mkdir -p "$(dirname "$p")"
                cp -aT "$ASSET_SAFE/$p" "$p"
                echo "[CD] restored $p"
              fi
            done
            # The binary is 82.7 MB of the ~644 MB these paths total, so confirm it landed rather
            # than trusting the copy: a missing FoldX is a silent biophysical-model failure.
            # A warning, not an error: the app degrades to "FoldX unavailable" rather than failing
            # to serve (see doc/ENERGETICS_AUDIT_AND_PLAN.md), and a missing licensed binary must
            # not take the site down for an unrelated reason.
            #
            # The chmod matters because the Dockerfile's own `chmod +x` only applies to the copy
            # inside the image; this path is bind-mounted from the host, so the bit has to be right
            # here. `cp -a` preserves it once set, but a cache re-seeded from a copy that lost it
            # (any route through a non-POSIX filesystem) would not, and the check below would then
            # report a binary that is present but unrunnable.
            chmod +x tools/foldx_linux/foldx_20261231 2>/dev/null || true
            if [ -x tools/foldx_linux/foldx_20261231 ]; then
              echo "[CD] FoldX binary present and executable"
            else
              echo "::warning::tools/foldx_linux/foldx_20261231 is missing or not executable on the VM; FoldX-backed features will degrade to unavailable"
            fi

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            # Recorded in the image so GET /api/v1/version reports what is actually running.
            export BUILD_COMMIT="$DEPLOY_SHA"
            export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # rollout.py re-flocks the inherited FD (validated against ~/.mse-deploy.lock),
            # verifies the checkout (HEAD == --commit, clean tree), and prints the terminal
            # DEPLOY_OK / DEPLOY_FAILED marker itself.
            python3 deploy/rollout.py --commit "$DEPLOY_SHA"
            MSE_WORKER_EOF

            setsid nohup bash "$WORKER" "$DEPLOY_SHA" >> "$LOG" 2>&1 < /dev/null &
            echo "[CD] dispatched detached; log on the VM: $LOG"

            WAIT="${DEPLOY_CONFIRM_SECONDS:-180}"
            deadline=$(( $(date +%s) + WAIT ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              if grep -q 'DEPLOY_OK' "$LOG" 2>/dev/null; then
                echo "[CD] deploy completed and verified within the ${WAIT}s window."
                exit 0
              fi
              if grep -q 'DEPLOY_FAILED' "$LOG" 2>/dev/null; then
                echo "::error::deploy failed on the VM"
                echo "[CD] --- tail of $LOG ---"
                tail -n 40 "$LOG"
                exit 1
              fi
              if grep -q 'DEPLOY_SUPERSEDED' "$LOG" 2>/dev/null; then
                echo "[CD] superseded on the VM while dispatching; skipping — the newer revision deploys itself."
                exit 0
              fi
              sleep 5
            done

            echo "[CD] No verdict after ${WAIT}s — normal, and needs NO attention. Two ways to"
            echo "[CD] leave the window: the standby is still building (the serving generation"
            echo "[CD] stays up while it warms and existing work drains), or the active rollout"
            echo "[CD] still holds the host lock and this deploy is QUEUED behind it. The"
            echo "[CD] detached worker owns that wait (up to 2h), deploys as soon as the lock"
            echo "[CD] frees, and skips itself cleanly if a newer revision reached main first."
            echo "[CD] Authoritative phase and final verdict: deploy/runtime/rollout.json."
            echo "[CD] Full log: $LOG"
            exit 0

      # THE VERDICT, NOT THE DISPATCH. The SSH step above catches instant failures and ships the
      # detached worker; it does not promise the revision is live. This step is that promise. It
      # polls the public /api/v1/version — the reader-visible signal, already trusted by
      # rollout.py's own pre-handover check and by the drift watch — until production reports
      # DEPLOY_SHA or the window lapses. Early exit means the cost is time-to-serve, not the
      # ceiling; holding an SSH session open for the same poll would have reintroduced the
      # run-36710716430 stall that `timeout-minutes` exists to bound.
      #
      # On lapse the step still exits 0. A red here would cry failure over a legitimate slow
      # rollout (cold builds hold the host lock for ~20 min by design) — the drift watch owns
      # that verdict with its 45-minute grace. So the run stays green but carries a `::warning::`
      # annotation naming the stale commit, which is loud where the old code was silent.
      - name: Wait for the rollout verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date -u +%s) + DEPLOY_VERDICT_SECONDS ))

          # SUPERSEDED REVISIONS DO NOT WAIT. The dispatch step above exits 0 when main has already
          # moved past DEPLOY_SHA, and nothing was dispatched for it — so production will never
          # serve DEPLOY_SHA, and polling for it would burn the whole window (and hold the
          # production-deployment lock) for a warning that is wrong. The newer commit's own CD run
          # owns the verdict. The same check repeats about once a minute because a merge can land
          # mid-poll. A failed API read leaves the tip unknown, which keeps waiting.
          main_tip=""
          live=""
          tick=0
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            if [ $(( tick % 4 )) -eq 0 ]; then
              main_tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>/dev/null || true)"
              if [ -n "$main_tip" ] && [ "$main_tip" != "$DEPLOY_SHA" ]; then
                echo "[CD] verdict: superseded — main moved to $main_tip; that revision's own run reports its deploy."
                exit 0
              fi
            fi
            live="$(curl -fsS --max-time 15 "$LIVE_URL" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit","") or "")' 2>/dev/null \
              || true)"
            if [ "$live" = "$DEPLOY_SHA" ]; then
              echo "[CD] verdict: production serves $DEPLOY_SHA"
              gh api "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" -f state=success \
                -f context=production/deploy -f description="Live in production" >/dev/null || true
              exit 0
            fi
            tick=$(( tick + 1 ))
            sleep 15
          done

          echo "::warning::No verdict after ${DEPLOY_VERDICT_SECONDS}s (commit status production/deploy stays PENDING; the drift watch finalises it):production still serves ${live:-<unreachable>} for $DEPLOY_SHA. The rollout may still be in flight — the detached worker owns it and skips itself if main moved on."
          {
            echo "## Deployment verdict"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| production serves | \`$live\` |"
            echo "| this run deployed | \`$DEPLOY_SHA\` |"
            echo ""
            echo "The rollout is unconfirmed, not disproved: a cold build and its drain outlive this"
            echo "window by design. \`deploy/runtime/rollout.json\` on the host is authoritative, and"
            echo "the drift watch fails loudly once its grace window passes."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # A failed dispatch (SSH, invalid compose file, DEPLOY_FAILED inside the window) is a failed deploy.
      - name: Mark production deploy failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" -f state=failure \
            -f context=production/deploy -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Deploy failed; NOT live" >/dev/null || true
