name: Continuous Deployment (OCI)

on:
  # GATED ON CI. This workflow used to run on every push to main, so it deployed commits whose
  # lint/test/build gates had FAILED — observed: commit 4a6a949 was deployed (run 35455821454)
  # while its CI run 35455821450 died in the Python setup step before any gate ran.
  #
  # `types: [completed]` also fires for skipped and cancelled runs; the `if` below is what keeps
  # this to successful PUSH runs of the default branch (a fork PR whose head branch happens to be
  # named `main` also satisfies `branches`, and must not deploy).
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Hard ceiling on the whole job. Cutting the confirmation window (see DEPLOY_CONFIRM_SECONDS
    # below) leaves roughly 20 s of real work, but the cost that actually hurt sat OUTSIDE that
    # window: in run 36710716430 the SSH step spent 40 min 31 s between drone-ssh printing its
    # version banner (11:47:45) and the first line of the remote script (12:28:16) — the VM was too
    # busy to finish an SSH session — and the step still reported success 43 min later. The action's
    # `timeout` input only bounds the initial dial, not the handshake after it, so nothing here
    # stopped it. 6 min leaves room for a slow-but-alive VM (a 180 s workflow_dispatch window plus
    # setup is ~4 min) while refusing to bill an hour for a VM that is not answering. A red run at
    # this limit means "the deploy was never dispatched", which is what the runs list should show.
    timeout-minutes: 6
    if: >-
      github.repository == 'Huthaifa-HajAhmad/Missense-Structural-Explorer' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    env:
      OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      # The revision CI just validated. Deploying exactly this commit is what makes the gate mean
      # something: a push that lands while CI is still running is not deployed by this run.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # How long the runner waits for the VM to report a verdict before it stops watching.
      #
      # Shortened 2026-09-30 from a flat "180". Measured on the five most recent CD runs: the SSH
      # step took 186/187/197/207/237 s and NOT ONE of them reported DEPLOY_OK inside the window.
      # Every run sat out the full 180 s and left through the "still building" branch below, so the
      # window was buying zero verification while costing ~180 s of billed runner time per deploy
      # (~600 of the 1,800-minute month at 202 deploys — a third of the budget spent asleep).
      #
      # A warm-cache deploy really does finish in ~110 s, but the runner no longer watches the build,
      # so waiting here is not what makes a deploy safe: the health-gated standby handover is.
      # The window still catches immediate failures on
      # an error that happens on the VM immediately — invalid compose file, no docker daemon, the
      # superseded-revision guard tripping — and all of those surface in seconds, never minutes.
      # So a push deploy waits 30 s, while a manual workflow_dispatch keeps the long window: there a
      # human pressed the button and asked for the verdict. Tune here, not in the step.
      DEPLOY_CONFIRM_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '180' || '30' }}
    steps:
      - name: Require deploy credentials
        # A skipped deploy is indistinguishable from a successful one in the runs list, which is
        # how an unconfigured secret comes to look like a healthy pipeline. Fail loudly instead.
        run: |
          if [ -z "$OCI_SSH_HOST" ] || [ -z "$OCI_SSH_KEY" ]; then
            echo "::error::OCI_SSH_HOST / OCI_SSH_KEY are not configured; refusing to report success without deploying."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # THE RUNNER NO LONGER WATCHES THE BUILD.
      #
      # This step used to hold the runner for the entire `docker compose up -d --build`, which runs
      # on the OCI VM. Run 36035616379 held it for 13m04s of a 13m17s job; the runner was idle for
      # all of it, and the account was billed for it. Across 202 CD runs in the Sep 2026 cycle that
      # was the single largest avoidable line in a 1,800-minute month.
      #
      # The build is now dispatched detached (`setsid nohup`) and the step returns as soon as the VM
      # has a verdict OR the confirmation window lapses — whichever comes first. The gate is kept
      # rather than dropped: the detached script writes a terminal marker, and this step exits
      # non-zero on `DEPLOY_FAILED`, so a fast failure still fails the run.
      #
      # What is deliberately NOT claimed: when the window lapses, this run no longer asserts that
      # the deploy succeeded. Production safety does not depend on the runner asserting it.
      # deploy/rollout.py retains the old app, checks the standby revision and sidecar readiness,
      # reloads Caddy, then drains requests and transfers exclusive SQLite worker ownership.
      # The host lock and deployment journal outlive this SSH confirmation window.
      - name: Deploy to OCI VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          # No longer a deploy timeout — only has to outlast the confirmation window plus dispatch.
          command_timeout: 10m
          envs: DEPLOY_SHA,DEPLOY_CONFIRM_SECONDS
          script: |
            set -eu
            cd Missense-Structural-Explorer || exit 1
            echo "[CD] Deploying the CI-validated commit $DEPLOY_SHA"

            git fetch --all --prune

            # COMMIT ORDERING PRE-CHECK: CI runs can finish out of order, so an older commit's
            # successful run could otherwise overwrite a newer deployment. If a newer revision
            # already reached the tip of main, skip immediately without waiting or taking the lock.
            TIP="$(git rev-parse origin/main)"
            if [ "$TIP" != "$DEPLOY_SHA" ]; then
              echo "[CD] $DEPLOY_SHA is superseded by $TIP; skipping — the newer revision deploys itself."
              exit 0
            fi

            # The workflow concurrency ends before the detached build does. This host lock spans
            # checkout, asset restoration, build, handover, and drain. Wait up to 180s for an active
            # rollout to complete handover before checking status again.
            exec 9>"$HOME/.mse-deploy.lock"
            if ! flock -w 180 9; then
              echo "[CD] DEPLOY_DEFERRED: another rollout owns the host lock after 180s; production unchanged."
              git fetch --all --prune
              LATEST_TIP="$(git rev-parse origin/main)"
              if [ "$LATEST_TIP" != "$DEPLOY_SHA" ]; then
                echo "[CD] $DEPLOY_SHA was superseded by $LATEST_TIP while waiting; skipping cleanly."
                exit 0
              fi
              exit 1
            fi
            export MSE_DEPLOY_LOCK_FD=9

            # Re-verify tip after acquiring lock in case a newer commit landed while waiting.
            git fetch --all --prune
            TIP="$(git rev-parse origin/main)"
            if [ "$TIP" != "$DEPLOY_SHA" ]; then
              echo "[CD] $DEPLOY_SHA is superseded by $TIP; skipping — the newer revision deploys itself."
              exit 0
            fi

            # UNTRACKED-ASSET PRESERVE. FoldX (licensed), the model weights, and the deployment
            # runbook are deliberately untracked as of 2026-09-29, so that nothing licensed,
            # third-party, or infrastructure-revealing is redistributed if this repo is ever made
            # public. That creates a deploy hazard which was verified on a throwaway repo, not
            # assumed: checking out a revision that does not track a path that the CURRENT revision
            # does track DELETES it. Simulated `A (tracks the binary) -> git checkout --force B (does
            # not)` and the file was gone; when the whole directory stops being tracked, the
            # directory itself is removed, so the compose bind mount at ../tools/foldx_linux would
            # have pointed at nothing and FoldX would have vanished from the running app on the
            # first deploy after the untracking commit.
            #
            # This survives because a filesystem copy is taken before the switch and put back after
            # it. It is unconditional and idempotent: on a revision where these paths are still
            # tracked the copy is simply restored over itself.
            ASSET_PATHS="tools/foldx tools/foldx_linux tools/thermompnn/models tools/thermompnn/vanilla_model_weights tools/model_server_app/checkpoints doc/DEPLOYMENT_OCI.md"
            ASSET_SAFE="$HOME/.mse-untracked-assets"
            rm -rf "$ASSET_SAFE"
            mkdir -p "$ASSET_SAFE"
            for p in $ASSET_PATHS; do
              if [ -e "$p" ]; then
                mkdir -p "$ASSET_SAFE/$(dirname "$p")"
                # -T: copy AS the destination, never INTO it.
                cp -aT "$p" "$ASSET_SAFE/$p"
                echo "[CD] preserved $p"
              fi
            done

            git checkout --force "$DEPLOY_SHA"

            for p in $ASSET_PATHS; do
              if [ -e "$ASSET_SAFE/$p" ]; then
                # Copy AS the destination without deleting bind-mounted files from the serving app.
                # -T avoids repeated directory nesting on every subsequent deployment.
                mkdir -p "$(dirname "$p")"
                cp -aT "$ASSET_SAFE/$p" "$p"
                echo "[CD] restored $p"
              fi
            done
            # The binary is 82.7 MB of the ~644 MB these paths total, so confirm it landed rather
            # than trusting the copy: a missing FoldX is a silent biophysical-model failure.
            # A warning, not an error: the app degrades to "FoldX unavailable" rather than failing
            # to serve (see doc/ENERGETICS_AUDIT_AND_PLAN.md), and a missing licensed binary must
            # not take the site down for an unrelated reason.
            #
            # The chmod matters because the Dockerfile's own `chmod +x` only applies to the copy
            # inside the image; this path is bind-mounted from the host, so the bit has to be right
            # here. `cp -a` preserves it once set, but a cache re-seeded from a copy that lost it
            # (any route through a non-POSIX filesystem) would not, and the check below would then
            # report a binary that is present but unrunnable.
            chmod +x tools/foldx_linux/foldx_20261231 2>/dev/null || true
            if [ -x tools/foldx_linux/foldx_20261231 ]; then
              echo "[CD] FoldX binary present and executable"
            else
              echo "::warning::tools/foldx_linux/foldx_20261231 is missing or not executable on the VM; FoldX-backed features will degrade to unavailable"
            fi

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            # Recorded in the image so GET /api/v1/version reports what is actually running.
            export BUILD_COMMIT="$DEPLOY_SHA"
            export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            LOG="$HOME/mse-deploy-$(echo "$DEPLOY_SHA" | cut -c1-12).log"
            : > "$LOG"

            # Quoted heredoc: nothing below is interpolated by this shell, so `$?` and friends
            # belong to the detached script rather than being expanded here.
            cat > "$HOME/mse-deploy-run.sh" <<'MSE_DEPLOY_EOF'
            set -e
            on_fail() { rc=$?; echo "[CD] DEPLOY_FAILED rc=$rc"; exit "$rc"; }
            trap on_fail ERR
            python3 deploy/rollout.py --commit "$BUILD_COMMIT"
            MSE_DEPLOY_EOF

            setsid nohup bash "$HOME/mse-deploy-run.sh" >> "$LOG" 2>&1 < /dev/null &
            echo "[CD] dispatched detached; log on the VM: $LOG"

            WAIT="${DEPLOY_CONFIRM_SECONDS:-180}"
            deadline=$(( $(date +%s) + WAIT ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              if grep -q 'DEPLOY_OK' "$LOG" 2>/dev/null; then
                echo "[CD] deploy completed and verified within the ${WAIT}s window."
                exit 0
              fi
              if grep -q 'DEPLOY_FAILED' "$LOG" 2>/dev/null; then
                echo "::error::deploy failed on the VM"
                echo "[CD] --- tail of $LOG ---"
                tail -n 40 "$LOG"
                exit 1
              fi
              sleep 5
            done

            echo "[CD] Still building after ${WAIT}s. The build continues on the VM and is NOT cancelled."
            echo "[CD] The serving generation remains available while the standby warms and existing work drains."
            echo "[CD] Inspect deploy/runtime/rollout.json for the authoritative phase and final verdict."
            echo "[CD] Full log: $LOG"
            exit 0
