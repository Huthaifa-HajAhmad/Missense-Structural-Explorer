name: Production drift watch

# WHY THIS EXISTS
# `cd.yml` dispatches a detached worker on the host and returns after a short confirmation window,
# deliberately, so a slow VM never bills idle runner minutes. The cost is that a deploy which fails
# *after* that window — a build that runs out of disk at the final image unpack, a handover that
# cannot drain — leaves the CD run GREEN. Production then keeps serving an older revision and
# nothing says so. That is not hypothetical: on 2026-10-10 two deploys (d8d9f6d, then a39e81ff)
# died at "no space left on device" while their runs showed success, and the box stayed two
# revisions behind until it was noticed by hand.
#
# This watch is the missing signal. It compares the revision production actually reports (the same
# public `/api/v1/version` that `rollout.py` itself trusts) against the tip of `main`, and fails when
# a commit CD claims to have deployed is not live.
#
# WHEN IT RUNS. A cron alone is not enough: GitHub throttles scheduled workflows on quiet repositories
# (observed gaps of 5–6 h despite an hourly cron, 2026-10-10/11), so a silent failure could sit
# unnoticed for most of a day. It therefore also runs on every CD completion, which is the moment
# production state changes, as well as hourly as a backstop.
#
# THE GRACE WINDOW ONLY EXCUSES A ROLLOUT THAT CAN STILL BE IN FLIGHT. After a SUCCESSFUL CD run a
# detached rollout may still be building/handing over, so a mismatch younger than GRACE_MINUTES is a
# notice. A NON-SUCCESS CD run is different: the worker either never started or already stopped
# (rollback keeps the old generation serving), so nothing is in flight and the mismatch is reported
# at once — that is what makes running on CD completion worth doing rather than decorative.
#
# A COMMIT NOTHING WILL EVER DEPLOY IS DRIFT TOO. Because `cd.yml` is gated on a successful push run
# of `ci.yml` and nothing retries a cancelled or failed gate, a merge whose CI run died has no deploy
# coming. On 2026-11-11/12 main@451b01ea sat in exactly that state — its CI push run was cancelled
# 69 s in by `concurrency: cancel-in-progress`, its CD run concluded `skipped` — and this watch
# warned and exited 0 on every cron for 29 hours while production served the previous merge. The
# branch below therefore reads CI for the tip: mid-flight is a notice, finished-without-success is a
# failure that names the unstick, and green CI with no CD run gets CD_TRIGGER_MINUTES of scheduling
# lag before it counts as drift.
#
# A red run here is email/The-Actions-tab visible by default. Add Slack/webhook delivery later only
# if that proves too quiet.
on:
  schedule:
    # Hourly backstop. Cheap: one curated API call, one curl, no checkout.
    - cron: "23 * * * *"
  # Prompt check at the moment a deploy finishes, instead of waiting for the throttled cron.
  workflow_run:
    workflows: ["Continuous Deployment (OCI)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: production-drift-watch
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIVE_URL: https://missense-resolve.duckdns.org/api/v1/version
      # A detached rollout (build + handover + drain) can outlast CD by a wide margin. Below this age
      # a mismatch is expected and never fails the watch.
      GRACE_MINUTES: "45"
      # How long a "nothing is deploying this commit" read may still mean "not yet". The hop from CI
      # concluding to its workflow_run CD run being created is normally seconds; a push a few seconds
      # old may not have its CI run yet at all. This only has to outlast scheduling lag — a rollout is
      # GRACE_MINUTES' problem.
      CD_TRIGGER_MINUTES: "10"
    steps:
      - name: Compare the deployed revision with main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The commit date rides along in the same call: a push seconds old may not have its CI run
          # yet, and that must read as "waiting", not as "nothing will ever deploy it".
          main_row=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '[.sha, .commit.committer.date] | @tsv') || {
            echo "::error::Could not read the tip of main via the API; cannot check for drift."
            exit 1
          }
          main=$(printf '%s' "$main_row" | cut -f1)
          main_date=$(printf '%s' "$main_row" | cut -f2)
          echo "main       = $main"

          # The commit's `production/deploy` status is the reader-facing truth (CD sets it pending).
          # This watch finalises it with nobody waiting: success once production serves the commit,
          # failure once it provably will not. Best-effort: a status write never changes the verdict.
          set_status() {
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${main}" -f state="$1" \
              -f context=production/deploy -f description="$2" >/dev/null || true
          }

          live=$(curl -fsS --max-time 20 "$LIVE_URL" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
          echo "production = ${live:-<unreachable>}"

          if [ -z "$live" ]; then
            echo "::error::Production did not report a revision from $LIVE_URL. The site may be down."
            exit 1
          fi

          if [ "$live" = "$main" ]; then
            echo "Production matches main."
            set_status success "Live in production"
            {
              echo "## Production drift watch"
              echo ""
              echo "✅ \`$live\` = \`main\` = \`$main\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Production is behind. Distinguish "a deploy is still running" from a silent failure using
          # the newest CD run for the commit that main points at.
          #
          # `--repo` is load-bearing: `gh run list` otherwise resolves the repository from the git
          # remotes, and this job deliberately has no checkout. On 2026-10-11 (run 38146183763) the
          # resulting `fatal: not a git repository` aborted the step under `set -euo pipefail` the
          # moment production was mid-rollout — exactly the branch that handles a mismatch — so the
          # watch red-Xed on the case it exists to tolerate and never reached its grace logic. The
          # explicit guard keeps any future gh failure legible instead of an opaque abort.
          #
          # `skipped` RUNS ARE EXCLUDED. `cd.yml` listens for every completed CI run, including the
          # one `cancel-in-progress` kills when a second merge lands seconds after the first, and
          # GitHub stamps a `workflow_run` run with the default branch tip, not the triggering run's
          # sha. So on 2026-10-12 (run 38303853595) a CD run skipped on behalf of the cancelled CI
          # of f9b02fb was attributed to the NEW tip 4bfd594 and read here as "CD concluded
          # 'skipped'" — a red X while CI for 4bfd594 was still running and its real deploy had not
          # started. A skipped run never deployed anything, so it says nothing about drift.
          run_json=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=cd.yml --branch main --limit 30 \
            --json headSha,status,conclusion,createdAt,updatedAt,url \
            --jq "[.[] | select(.headSha == \"$main\" and .conclusion != \"skipped\")] | sort_by(.createdAt) | last // empty") || {
            echo "::error::Could not list CD runs (gh run list failed); cannot tell a slow detached rollout from real drift. main=$main, production=${live:-<unreachable>}."
            exit 1
          }

          if [ -z "$run_json" ]; then
            # NOTHING IS DEPLOYING THIS COMMIT — WHICH IS NOT THE SAME AS "NOTHING HAS STARTED YET".
            # `cd.yml` runs only after a SUCCESSFUL push run of `ci.yml`, and no gate is ever retried
            # on its own, so CI's state is the difference between "a deploy is coming" and "this
            # commit will never be live". Read it for THIS sha and decide; do not warn.
            ci_json=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --branch main --limit 30 \
              --json headSha,status,conclusion,createdAt,updatedAt,url \
              --jq "[.[] | select(.headSha == \"$main\")] | sort_by(.createdAt) | last // empty") || {
              echo "::error::Could not list CI runs (gh run list failed); cannot tell whether a deploy is still coming for $main. production is on $live."
              exit 1
            }

            if [ -z "$ci_json" ]; then
              # No CI run at all: a `[skip ci]` push, a disabled workflow, or a run deleted while CD
              # had not started. Nothing can trigger a deploy, so this is drift — unless the commit
              # is seconds old and its run is still being created.
              main_age=""
              if [ -n "$main_date" ] && main_epoch=$(date -u -d "$main_date" +%s 2>/dev/null); then
                main_age=$(( ( $(date -u +%s) - main_epoch ) / 60 ))
              fi
              if [ -n "$main_age" ] && [ "$main_age" -lt "$CD_TRIGGER_MINUTES" ]; then
                echo "::notice::main moved ${main_age} min ago and has no CI run yet; the push is still being picked up. Not failing the watch."
                exit 0
              fi
              set_status failure "No CI run for this commit, so nothing will deploy it"
              echo "::error::No CI run exists for $main, so cd.yml will never be triggered and production stays on $live. Give the commit a gate (push again) or deploy it deliberately: gh workflow run cd.yml --ref main."
              exit 1
            fi

            CI_STATUS=$(printf '%s' "$ci_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
            CI_CONCLUSION=$(printf '%s' "$ci_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')
            CI_UPDATED_AT=$(printf '%s' "$ci_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("updatedAt",""))')
            CI_URL=$(printf '%s' "$ci_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url",""))')
            echo "CI for main: status=${CI_STATUS:-none} conclusion=${CI_CONCLUSION:-none} url=${CI_URL:-none}"

            # Queued or in progress: the one case where a deploy can still arrive on its own. This
            # check comes FIRST — a running gate must never be reported as drift.
            if [ "${CI_STATUS:-}" != "completed" ]; then
              echo "::notice::CI for $main is still ${CI_STATUS:-unknown}, so CD has not been triggered yet. Not failing the watch."
              exit 0
            fi

            if [ "${CI_CONCLUSION:-}" != "success" ]; then
              set_status failure "Will not deploy: CI for this commit concluded '${CI_CONCLUSION:-unknown}'"
              echo "::error::CI for $main concluded '${CI_CONCLUSION:-unknown}', so cd.yml will never run for it and production stays on $live. Re-run that gate (gh run rerun ${CI_URL##*/}) or deploy the commit deliberately (gh workflow run cd.yml --ref main)."
              exit 1
            fi

            # CI passed, so CD should exist: the workflow_run hop is seconds. Give scheduling lag its
            # window, then treat a missing CD run as the silent failure it is.
            if [ -z "$CI_UPDATED_AT" ]; then
              echo "::notice::CI for $main succeeded but has no timestamp to age. Not failing the watch."
              exit 0
            fi
            ci_age=$(( ( $(date -u +%s) - $(date -u -d "$CI_UPDATED_AT" +%s) ) / 60 ))
            if [ "$ci_age" -lt "$CD_TRIGGER_MINUTES" ]; then
              echo "::notice::CI for $main succeeded ${ci_age} min ago and no CD run exists for it yet; workflow_run scheduling can lag. Not failing the watch."
              exit 0
            fi
            set_status failure "CI passed but no CD run was created for this commit"
            echo "::error::CI for $main succeeded ${ci_age} min ago but no CD run exists for it, so production stays on $live. Dispatch it: gh workflow run cd.yml --ref main."
            exit 1
          fi

          STATUS=$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          CONCLUSION=$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')
          UPDATED_AT=$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("updatedAt",""))')
          RUN_URL=$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url",""))')
          echo "CD run for main: status=${STATUS:-none} conclusion=${CONCLUSION:-none} url=${RUN_URL:-none}"

          if [ "${STATUS:-}" != "completed" ]; then
            echo "::notice::CD for main is still ${STATUS:-unknown}; production may be mid-handover. Not failing the watch."
            exit 0
          fi

          # THE GRACE WINDOW ONLY APPLIES TO A SUCCESSFUL RUN. `cd.yml` returns after a short
          # confirmation window while its detached worker finishes build + handover, so a freshly
          # completed successful run may not be live yet — defer then. A non-success run has no
          # rollout in flight: the worker either never started (credentials/SSH failure, job timeout)
          # or already stopped (a `DEPLOY_FAILED` inside the window rolls back and keeps the old
          # generation serving). Waiting GRACE_MINUTES for it just delays a red the cron would
          # eventually produce — and on a throttled schedule that "eventually" was hours.
          if [ "${CONCLUSION:-}" = "success" ]; then
            if [ -z "$UPDATED_AT" ]; then
              echo "::notice::CD run for main is complete but has no timestamp to age. Not failing the watch."
              exit 0
            fi
            age=$(( ( $(date -u +%s) - $(date -u -d "$UPDATED_AT" +%s) ) / 60 ))
            echo "CD run completed ${age} min ago"
            AGE_TEXT="${age} min ago"
            if [ "$age" -lt "$GRACE_MINUTES" ]; then
              echo "::notice::Within the ${GRACE_MINUTES}-minute grace window; a detached rollout may still be finishing. Not failing the watch."
              exit 0
            fi
          else
            AGE_TEXT="no grace window applies"
            echo "CD run concluded '${CONCLUSION:-unknown}': nothing is in flight, so no grace window applies."
          fi

          set_status failure "Not live in production (production serves ${live:0:7})"
          {
            echo "## Production drift watch"
            echo ""
            echo "❌ Production is **not** serving the revision CD reported."
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| main | \`$main\` |"
            echo "| production | \`$live\` |"
            echo "| newest CD run for main | ${CONCLUSION:-unknown}, ${AGE_TEXT} |"
            echo "| run | ${RUN_URL:-none} |"
            echo ""
            echo "Inspect \`deploy/runtime/rollout.json\` and the newest \`~/mse-deploy-*.log\` on the host."
            echo "A \`success\` CD run that did not land means the detached rollout failed after CD returned."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${CONCLUSION:-}" = "success" ]; then
            echo "::error::CD reported success for $main, but production still serves $live (${age} min later). The detached rollout failed silently."
          else
            echo "::error::The newest CD run for $main concluded '${CONCLUSION:-unknown}', and production still serves $live."
          fi
          exit 1
