[project]
name = "model-server"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "torch>=2.4.0",
  "transformers>=4.44.0",
  "huggingface_hub>=0.24.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "pandas>=2.0.0",
  "biopython>=1.83",
  "biotite>=1.7.1",
  "esm @ git+https://github.com/Biohub/esm.git@main",
  "mini3di"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
# The lockfile resolved `transformers` to a commit on the private Biohub fork, even
# though it is declared against PyPI above and `Biohub/esm` only requires
# `transformers>=4.5` - nothing in this dependency set needs a fork API. That private
# git source is what broke the CD image build: `uv sync` inside Docker cannot
# authenticate to github.com, so it failed with "could not read Username" and the
# deployment never started. Restoring the resolution to the explicitly declared PyPI
# dependency keeps the build reproducible without shipping a credential.
override-dependencies = ["transformers==4.57.6"]

